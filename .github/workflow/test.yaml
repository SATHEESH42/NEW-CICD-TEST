name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.satheesh45}}
        password: ${{ secrets.SATHEESH@420}}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.satheesh45 }}/my-app:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.satheesh45 }}/my-app:latest